name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr_branch: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps pyproject.toml but cannot regenerate uv.lock, and
  # `uv sync --locked` fails when the two disagree. Re-lock on the release branch.
  relock:
    needs: release-please
    if: needs.release-please.outputs.pr_branch != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.pr_branch }}
      - uses: astral-sh/setup-uv@v5
      - run: uv lock
      - name: Commit lockfile
        run: |
          if git diff --quiet uv.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh uv.lock for release" uv.lock
          git push
